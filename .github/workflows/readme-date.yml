name: Update README date badge

on:
  push:
    paths:
      - README.md

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  badge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get README date
        id: date
        run: |
          DATE=$(git log -1 --format=%cs -- README.md)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Create badge
        run: |
          mkdir -p public
          cat > public/readme-date.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="28">
            <text x="0" y="18"
                  fill="#8b949e"
                  font-family="Arial,sans-serif"
                  font-size="14"
                  font-weight="bold">[ Last updated: ${{ steps.date.outputs.date }} ]</text>
          </svg>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4